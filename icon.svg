<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none" role="img" aria-label="Git repository guard">
  <title>Git 仓库保护</title>
  <!--
    The icon the Plugins page reads from `package.json.icon`, so it is drawn for that
    page and not for the header: the shipped plugin icons are 36-grid drawings whose
    art fills about four fifths of the box (auto-review's shield spans 7.5 to 30), and
    this one matches — the ring's outer edge lands at 14.94 of 18 units, 83%.

    It is the plugin's own art at the plugin's own coordinates: one transform maps the
    32-unit grid the header glyph is drawn on onto this 36-unit box, centred, scaled by
    36/32. Nothing inside is re-typed, so the two stay the same picture — the header
    keeps the smaller of the two, which is what its row calls for.
  -->
  <g transform="translate(18 18) scale(1.125) translate(-16 -16)">
    <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
      <path d="M9.9 10.55v10.9c0 1.41 2.73 2.55 6.1 2.55s6.1-1.14 6.1-2.55V10.55"/>
      <ellipse cx="16" cy="10.55" rx="6.1" ry="2.55"/>
      <path d="M9.9 13.2c0 1.41 2.73 2.55 6.1 2.55s6.1-1.14 6.1-2.55"/>
      <path d="M9.9 16c0 1.41 2.73 2.55 6.1 2.55s6.1-1.14 6.1-2.55"/>
      <path d="M9.9 18.8c0 1.41 2.73 2.55 6.1 2.55s6.1-1.14 6.1-2.55"/>
    </g>
    <circle cx="16" cy="16" r="10.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M8.6 23.4 23.4 8.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
  </g>
</svg>
